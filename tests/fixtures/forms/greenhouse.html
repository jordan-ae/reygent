<!doctype html>
<!--
  Modelled on a live job-boards.greenhouse.io posting, read in a browser in October 2026
  (gitlab and grafanalabs boards): text inputs with label[for] + aria-label +
  aria-required and no name attribute; the email field typed "text" with
  autocomplete="email"; every dropdown a react-select combobox whose options exist only
  while it is open, in the listbox its input points at with aria-controls; a second,
  permanently hidden 244-country listbox that intl-tel-input keeps for the phone field;
  "Location (City)" as a combobox that lists nothing until typed into; visually-hidden
  file inputs whose own label is just "Attach" inside a role="group" that carries the
  question; "Enter manually" revealing a textarea; a hidden required input mirroring
  each required dropdown. The passive check is as on the live page: a site key in an
  inline script, the reCAPTCHA badge with its frame in the corner, a hidden response
  textarea — nothing a person is asked to do. The dropdown script at the bottom imitates
  react-select's behaviour (open on mouse-down, list in the DOM only while open, Escape
  closes, the choice shown in a .select__single-value).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Application for Senior Engineer at Fixture Labs</title>
    <script>
      window.ENV = { GOOGLE_RECAPTCHA_INVISIBLE_KEY: "fixture-site-key", GOOGLE_RECAPTCHA_ENDPOINT: "/never-loaded.js" };
    </script>
    <style>
      .visually-hidden { border: 0; clip: rect(0 0 0 0); height: 1px; width: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; white-space: nowrap; }
      .field-wrapper { margin: 12px 0; }
      label, .label { display: block; }
      .select__control { display: flex; border: 1px solid #ccc; min-height: 38px; width: 320px; position: relative; }
      .select__value-container { display: grid; flex: 1; padding: 2px 8px; }
      .select__input-container { display: inline-grid; grid-template-columns: 0 min-content; }
      .select__input { min-width: 2px; width: 100%; border: 0; outline: 0; padding: 0; }
      .select__menu { border: 1px solid #ccc; width: 320px; max-height: 200px; overflow: auto; background: #fff; }
      .select__option { padding: 6px 8px; cursor: default; }
      .iti__hide { display: none; }
      .grecaptcha-badge { position: fixed; right: 0; bottom: 14px; width: 256px; height: 60px; overflow: hidden; }
      .grecaptcha-badge iframe { border: 0; }
      .honey { position: absolute; left: -9999px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Senior Engineer</h1>
      <button type="button" class="btn btn--pill" aria-label="Apply">Apply</button>
      <div class="job__description"><p>We build fixtures. Remote, worldwide.</p></div>

      <form method="post" action="/submit?from=greenhouse" enctype="multipart/form-data" id="application-form" class="application--form">
        <div class="application--questions">
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="first_name-label" for="first_name" class="label label">First Name<span aria-hidden="true">*</span></label>
            <input id="first_name" class="input input__single-line" aria-label="First Name" aria-required="true" type="text" maxlength="255" autocomplete="given-name" value="" />
          </div></div></div>
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="last_name-label" for="last_name" class="label label">Last Name<span aria-hidden="true">*</span></label>
            <input id="last_name" class="input input__single-line" aria-label="Last Name" aria-required="true" type="text" maxlength="255" autocomplete="family-name" value="" />
          </div></div></div>
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="email-label" for="email" class="label label">Email<span aria-hidden="true">*</span></label>
            <input id="email" class="input input__single-line" aria-label="Email" aria-required="true" type="text" maxlength="255" autocomplete="email" value="" />
          </div></div></div>

          <div>
            <fieldset class="phone-input">
              <legend class="visually-hidden">Phone</legend>
              <div class="phone-input__country">
                <div class="select" data-select="country" data-options="United States +1|Afghanistan +93|Cameroon +237|Canada +1|France +33"><div class="select__container">
                  <label id="country-label" for="country" class="label select__label">Country</label>
                  <div class="select-shell"><div class="select__control"><div class="select__value-container">
                    <div class="select__placeholder" id="react-select-country-placeholder"></div>
                    <div class="select__input-container" data-value="">
                      <input class="select__input" autocapitalize="none" autocomplete="off" autocorrect="off" id="country" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="country-label" aria-required="false" role="combobox" value="" />
                    </div>
                  </div><div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div></div></div>
                  <input type="hidden" name="country" value="" />
                </div></div>
              </div>
              <div class="phone-input__phone"><div class="text-input-wrapper"><div class="input-wrapper">
                <label id="phone-label" for="phone" class="label label">Phone</label>
                <div class="iti iti--allow-dropdown">
                  <input id="phone" class="input input__single-line iti__tel-input" aria-label="Phone" aria-required="false" type="tel" maxlength="255" />
                  <!-- intl-tel-input's own country list: always in the page, never shown here. -->
                  <div id="iti-0__dropdown-content" class="iti__dropdown-content iti__hide">
                    <input id="iti-0__search-input" type="text" class="iti__search-input" placeholder="Search" role="combobox" aria-expanded="true" aria-label="Search" aria-controls="iti-0__country-listbox" aria-autocomplete="list" autocomplete="off" />
                    <ul class="iti__country-list" id="iti-0__country-listbox" role="listbox" aria-label="List of countries">
                      <li class="iti__country" id="iti-0__item-af" role="option" aria-selected="false"><span class="iti__country-name">Afghanistan</span><span class="iti__dial-code">+93</span></li>
                      <li class="iti__country" id="iti-0__item-cm" role="option" aria-selected="false"><span class="iti__country-name">Cameroon</span><span class="iti__dial-code">+237</span></li>
                      <li class="iti__country" id="iti-0__item-zw" role="option" aria-selected="false"><span class="iti__country-name">Zimbabwe</span><span class="iti__dial-code">+263</span></li>
                    </ul>
                  </div>
                </div>
              </div></div></div>
            </fieldset>
          </div>

          <div class="field-wrapper">
            <div class="select" data-select="candidate-location" data-options="" data-search="/v1/autocomplete"><div class="select__container">
              <label id="candidate-location-label" for="candidate-location" class="label select__label">Location (City)</label>
              <div class="select-shell"><div class="select__control select__control--outside-label"><div class="select__value-container">
                <div class="select__placeholder" id="react-select-candidate-location-placeholder"></div>
                <div class="select__input-container" data-value="">
                  <input class="select__input" autocapitalize="none" autocomplete="off" autocorrect="off" id="candidate-location" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="candidate-location-label" aria-required="false" role="combobox" value="" />
                </div>
              </div><div class="select__indicators"></div></div></div>
              <input type="hidden" name="candidate_location" value="" />
            </div></div>
            <!-- Asks the browser for the device's position. Never the operator's to press. -->
            <button type="button" class="btn btn--tertiary" id="locate-me">Locate me</button>
          </div>

          <div class="field-wrapper">
            <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
              <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
              <div class="file-upload__wrapper"><div class="button-container">
                <div class="secondary-button"><div>
                  <button type="button" class="btn btn--pill">Attach</button>
                  <label class="visually-hidden" for="resume">Attach</label>
                  <input id="resume" name="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf" />
                </div></div>
                <div class="secondary-button"><div>
                  <button type="button" class="btn btn--pill" data-testid="resume-text">Enter manually</button>
                  <label class="visually-hidden" for="resume_text">Enter manually</label>
                </div></div>
                <p class="file-upload__filetypes">Accepted file types: pdf, doc, docx, txt, rtf</p>
              </div></div>
            </div>
          </div>

          <div class="field-wrapper">
            <div role="group" aria-labelledby="upload-label-cover_letter" aria-required="false" class="file-upload">
              <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
              <div class="file-upload__wrapper"><div class="button-container">
                <div class="secondary-button"><div>
                  <button type="button" class="btn btn--pill">Attach</button>
                  <label class="visually-hidden" for="cover_letter">Attach</label>
                  <input id="cover_letter" name="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf" />
                </div></div>
                <div class="secondary-button"><div>
                  <button type="button" class="btn btn--pill" data-testid="cover_letter-text">Enter manually</button>
                  <label class="visually-hidden" for="cover_letter_text">Enter manually</label>
                </div></div>
                <p class="file-upload__filetypes">Accepted file types: pdf, doc, docx, txt, rtf</p>
              </div></div>
            </div>
          </div>
        </div>

        <div class="application--questions">
          <hr />
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="question_1-label" for="question_1" class="label label">LinkedIn Profile</label>
            <input id="question_1" name="question_1" class="input input__single-line" aria-label="LinkedIn Profile" aria-required="false" type="text" maxlength="255" value="" />
          </div></div></div>
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="question_2-label" for="question_2" class="label label">What's the name you'd prefer us to use throughout the interview process?</label>
            <input id="question_2" name="question_2" class="input input__single-line" aria-label="What's the name you'd prefer us to use throughout the interview process?" aria-required="false" type="text" maxlength="255" value="" />
          </div></div></div>

          <div class="field-wrapper">
            <div class="select" data-select="question_3" data-options="Yes|No"><div class="select__container">
              <label id="question_3-label" for="question_3" class="label select__label">Are you legally authorized to work in the country in which you are applying?<span aria-hidden="true">*</span></label>
              <div class="select-shell"><div class="select__control"><div class="select__value-container">
                <div class="select__placeholder" id="react-select-question_3-placeholder">Select...</div>
                <div class="select__input-container" data-value="">
                  <input class="select__input" autocapitalize="none" autocomplete="off" autocorrect="off" id="question_3" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="question_3-label" aria-required="true" role="combobox" value="" />
                </div>
              </div><div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div></div></div>
              <input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" name="question_3" value="" style="opacity: 0; width: 100%; height: 1px; position: absolute" />
            </div></div>
          </div>

          <div class="field-wrapper">
            <div class="select" data-select="question_4" data-options="Benin|Cameroon|Canada|United States"><div class="select__container">
              <label id="question_4-label" for="question_4" class="label select__label">What is your current country of residence?<span aria-hidden="true">*</span></label>
              <div class="select-shell"><div class="select__control"><div class="select__value-container">
                <div class="select__placeholder" id="react-select-question_4-placeholder">Select...</div>
                <div class="select__input-container" data-value="">
                  <input class="select__input" autocapitalize="none" autocomplete="off" autocorrect="off" id="question_4" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="question_4-label" aria-required="true" role="combobox" value="" />
                </div>
              </div><div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div></div></div>
              <input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" name="question_4" value="" style="opacity: 0; width: 100%; height: 1px; position: absolute" />
            </div></div>
          </div>
        </div>

        <!-- Not on the real page: a bot trap, to prove off-screen inputs are never typed into. -->
        <div class="honey"><label for="website_hp">Leave this blank</label><input id="website_hp" name="website_hp" type="text" tabindex="-1" autocomplete="off" /></div>

        <div class="application--submit"><button type="submit" class="btn btn--pill" aria-disabled="false">Submit application</button></div>
        <textarea id="g-recaptcha-response-100000" name="g-recaptcha-response" class="g-recaptcha-response" style="display: none"></textarea>
      </form>
    </main>

    <div class="grecaptcha-badge" data-style="bottomright">
      <div class="grecaptcha-logo"><iframe title="reCAPTCHA" width="256" height="60" src="/recaptcha/anchor"></iframe></div>
      <div class="grecaptcha-error"></div>
    </div>

    <script>
      // A stand-in for react-select: the list exists only while the dropdown is open.
      //
      // With data-search it is Greenhouse's location control, as its scripts build it:
      // 300 ms after the last keystroke the typed text goes to a Pelias geocoder
      // (GET <base>v1/autocomplete?api_key=…&layers=locality&lang=en&text=…); each
      // feature becomes an option labelled "City, Region, Country" (or "City,
      // Country"); and — because the select is a plain react-select — only the options
      // whose text CONTAINS what is typed are shown. "Douala, Cameroon" therefore
      // shows nothing, although the geocoder answers it; "Douala" shows them all.
      var fold = function (text) { return text.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
      var placeName = function (feature) {
        var given = feature.properties;
        var parts = given.label.split(",").map(function (part) { return part.trim(); });
        if (parts.length < 2 || parts.length > 3) return given.label;
        if (parts.length === 2) return [parts[0], given.country].join(", ");
        var state = [given.macroregion, given.macroregion_a].indexOf(parts[1]) >= 0 ? given.macroregion : given.region;
        return [parts[0], state, given.country].join(", ");
      };

      document.querySelectorAll("[data-select]").forEach(function (root) {
        var id = root.getAttribute("data-select");
        var fixed = root.getAttribute("data-options").split("|").filter(Boolean).map(function (text) { return { label: text, value: text }; });
        var search = root.getAttribute("data-search");
        var input = document.getElementById(id);
        var control = root.querySelector(".select__control");
        var store = root.querySelector("input[name]");
        var menu = null;
        var found = [];
        var loading = false;
        var timer;

        function listed() {
          if (!search) return fixed;
          var typed = fold(input.value.trim());
          return found.filter(function (option) { return fold(option.label + " " + option.value).indexOf(typed) >= 0; });
        }
        function close() {
          if (menu) menu.remove();
          menu = null;
          input.setAttribute("aria-expanded", "false");
          input.removeAttribute("aria-controls");
        }
        function choose(option) {
          var container = root.querySelector(".select__value-container");
          var shown = container.querySelector(".select__single-value");
          var placeholder = container.querySelector(".select__placeholder");
          if (placeholder) placeholder.remove();
          if (!shown) {
            shown = document.createElement("div");
            shown.className = "select__single-value";
            container.insertBefore(shown, container.firstChild);
          }
          shown.textContent = option.label;
          store.value = search ? JSON.stringify(option) : option.label;
          input.value = "";
          close();
        }
        function render() {
          if (!menu) return;
          var list = menu.firstChild;
          list.innerHTML = "";
          if (loading) {
            var notice = document.createElement("div");
            notice.className = "select__menu-notice select__menu-notice--loading";
            notice.textContent = "Loading...";
            list.appendChild(notice);
            return;
          }
          // No "No options" line: the location control hides it, so an empty list is just empty.
          listed().forEach(function (entry, index) {
            var option = document.createElement("div");
            option.className = "select__option";
            option.id = "react-select-" + id + "-option-" + index;
            option.setAttribute("role", "option");
            option.setAttribute("aria-disabled", "false");
            option.tabIndex = -1;
            option.textContent = entry.label;
            // mousedown must not blur the input, or the menu closes before the click lands.
            option.addEventListener("mousedown", function (event) { event.preventDefault(); });
            option.addEventListener("click", function () { choose(entry); });
            list.appendChild(option);
          });
        }
        function open() {
          if (menu) return;
          menu = document.createElement("div");
          menu.className = "select__menu";
          var list = document.createElement("div");
          list.className = "select__menu-list";
          list.id = "react-select-" + id + "-listbox";
          list.setAttribute("role", "listbox");
          menu.appendChild(list);
          root.querySelector(".select-shell").appendChild(menu);
          input.setAttribute("aria-expanded", "true");
          input.setAttribute("aria-controls", list.id);
          render();
        }

        control.addEventListener("mousedown", function (event) {
          event.preventDefault();
          input.focus();
          if (menu) close(); else open();
        });
        // Greenhouse opens the menu on any key-up but Escape, Tab and Enter.
        input.addEventListener("keyup", function (event) {
          if (event.key === "Escape" || event.key === "Tab") close();
          else if (event.key !== "Enter") open();
        });
        // react-select throws the typed text away when the input loses focus.
        input.addEventListener("blur", function () { input.value = ""; close(); });
        if (search) {
          input.addEventListener("input", function () {
            clearTimeout(timer);
            render();
            var text = input.value;
            if (!text) return;
            loading = true;
            render();
            timer = setTimeout(function () {
              fetch(search + "?api_key=fixture&layers=locality&lang=en&text=" + encodeURIComponent(text))
                .then(function (response) { return response.json(); })
                .then(function (body) {
                  found = body.features.map(function (feature) { return { label: placeName(feature), value: feature.properties.id }; });
                  loading = false;
                  render();
                });
            }, 300);
          });
        }
      });

      // Boards differ on whether the location is required (grafanalabs: yes, gitlab: no).
      if (/[?&]location=required\b/.test(window.location.search)) {
        document.getElementById("candidate-location").setAttribute("aria-required", "true");
      }
      document.getElementById("locate-me").addEventListener("click", function (event) {
        event.currentTarget.setAttribute("data-pressed", "true");
      });

      // The textarea only exists once "Enter manually" is pressed, as on the real board.
      document.querySelector('[data-testid="cover_letter-text"]').addEventListener("click", function (event) {
        var holder = event.currentTarget.parentElement;
        if (document.getElementById("cover_letter_text")) return;
        var area = document.createElement("textarea");
        area.id = "cover_letter_text";
        area.name = "cover_letter_text";
        area.className = "input";
        area.rows = 6;
        holder.appendChild(area);
      });
    </script>
  </body>
</html>
