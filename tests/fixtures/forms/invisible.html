<!doctype html>
<!--
  A form protected by an invisible, score-only check, the way job-boards.greenhouse.io
  and jobs.ashbyhq.com ship it: no widget, no iframe, no data-sitekey - only a site key
  inside an inline configuration script, used when Submit is pressed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply - Site Reliability Engineer</title>
    <script>
      window.ENV = { GOOGLE_RECAPTCHA_INVISIBLE_KEY: "fixture-key", GOOGLE_RECAPTCHA_ENDPOINT: "/never-loaded.js" };
    </script>
  </head>
  <body>
    <main>
      <h1>Site Reliability Engineer</h1>
      <form method="post" action="/submit?from=invisible">
        <p><label for="name">Full name</label><input id="name" name="name" type="text" required /></p>
        <p><label for="email">Email</label><input id="email" name="email" type="email" required /></p>
        <p><label for="github">GitHub</label><input id="github" name="github" type="url" /></p>
        <p><button type="submit">Submit application</button></p>
      </form>
    </main>
  </body>
</html>
