<!doctype html>
<!--
  A form whose server answers a POST with the same form again (think: a validation
  error the operator cannot see coming). Nothing here ever reads as a confirmation.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply - Data Engineer</title>
  </head>
  <body>
    <main>
      <h1>Data Engineer</h1>
      <p>Once your application is submitted, a recruiter reviews it within a week.</p>
      <form method="post" action="/stuck">
        <p><label for="name">Full name</label><input id="name" name="name" type="text" required /></p>
        <p><label for="email">Email</label><input id="email" name="email" type="email" required /></p>
        <p><label for="linkedin">LinkedIn</label><input id="linkedin" name="linkedin" type="url" /></p>
        <p><button type="submit">Submit</button></p>
      </form>
    </main>
  </body>
</html>
